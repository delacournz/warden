[install]
# Refuse package versions published < 3 days ago. Worm releases (e.g. the
# May 2026 @tanstack compromise) are typically pulled within hours.
minimumReleaseAge = 259200
# Our own packages are exempt: the OpenTelemetry family is published from delacour-monorepo and
# should install the day it ships. The release age only defends against third-party worms.
minimumReleaseAgeExcludes = ["@delacournz/otel", "@delacournz/otel-server", "@delacournz/otel-start", "@delacournz/otel-web"]
# Metro (apps/example) resolves by walking node_modules and can't see through
# Bun's isolated layout (node_modules/.bun); React Native tooling expects a
# flat, hoisted tree.
linker = "hoisted"

# `@delacournz/*` (the OpenTelemetry packages from delacour-monorepo) is published to GitHub
# Packages, not npm. Installing it needs a CLASSIC personal access token with `read:packages` in
# NPM_TOKEN — GitHub's npm registry rejects fine-grained tokens. On Railway it is a preserved
# variable on `warden-docs`; locally, export it in your shell. The only users are apps/docs'
# optionalDependencies, so without the token `bun install` warns on the 401 and carries on: the CLI
# and packages never need it, and the docs run untraced (apps/docs/src/server/otel.ts).
[install.scopes]
"@delacournz" = { url = "https://npm.pkg.github.com", token = "$NPM_TOKEN" }
