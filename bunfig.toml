[install]
# Refuse package versions published < 3 days ago. Worm releases (e.g. the
# May 2026 @tanstack compromise) are typically pulled within hours.
minimumReleaseAge = 259200
# Our own packages are exempt: the OpenTelemetry family and the design systems (`@delacournz/ui`,
# `@delacournz/apogee`) are published from delacour-monorepo and should install the day they
# ship. The release age only defends against third-party worms.
minimumReleaseAgeExcludes = ["@delacournz/otel", "@delacournz/otel-server", "@delacournz/otel-start", "@delacournz/otel-web", "@delacournz/ui", "@delacournz/apogee"]
# Metro (apps/example) resolves by walking node_modules and can't see through
# Bun's isolated layout (node_modules/.bun); React Native tooling expects a
# flat, hoisted tree.
linker = "hoisted"

# `@delacournz/*` (delacour-monorepo's packages: the OpenTelemetry family and the `ui` / `apogee`
# design systems) is published to GitHub Packages, not npm. Installing it needs a CLASSIC personal
# access token with `read:packages` in NPM_TOKEN — GitHub's npm registry rejects fine-grained
# tokens. On Railway it is a preserved variable on `warden-docs`; CI reads it from the
# `NPM_READ_TOKEN` secret; locally, export it in your shell. Every user is an optionalDependency, so
# without the token `bun install` warns on the 401 and carries on: the CLI and packages never need
# it, the docs run untraced (apps/docs/src/server/otel.ts), and only the apps that render a design
# system (apps/viewer) fail to typecheck or build.
[install.scopes]
"@delacournz" = { url = "https://npm.pkg.github.com", token = "$NPM_TOKEN" }
