[package]
name = "warden-viewer"
description = "Native viewer for a hosted warden device"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "warden_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# Save panel for screenshots. The plugin returns a path only; the PNG is written in session-free Rust.
tauri-plugin-dialog = "2"
# Opens the launch-time billing URL from Rust only; no JS permission is granted.
tauri-plugin-opener = "2"
# Rust-side logging to stderr: stdout carries the process contract and nothing else.
tauri-plugin-log = "2"
log = "0.4"
time = { version = "0.3", features = ["parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls so the bundle never links the system TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Local socket transport (src/ipc.rs): unix sockets, Windows named pipes, timers, spawn_blocking.
tokio = { version = "1", features = ["net", "io-util", "rt", "time", "sync", "macros"] }
# Live input socket (src/input_ws.rs), rustls like reqwest.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
webrtc = "0.21"
bytes = "1.12.1"
rtc = "0.21"
async-trait = "0.1.92"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native resize hooks that keep the window at the device aspect (src/aspect_*.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
