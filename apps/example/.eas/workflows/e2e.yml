name: e2e

# warden's iOS e2e suite on a hosted EAS macOS worker, warden called directly from the steps.
#
# 1. Reuse an EAS build for the current native fingerprint (any build of `profile`, e.g. one bench-build.yml made);
#    build one only when none matches.
# 2. Put warden on PATH: by default this checkout's own CLI (so a warden change is tested before it is released) with
#    the released simulator helper; `-F warden=npm` installs the published CLI at the @delacour/warden-e2e version
#    instead (cached per version), the setup the docs teach.
# 3. `warden builds import --kind simulator-base` files the downloaded .app as the base (its embedded JS is stripped),
#    then `warden e2e` repacks this checkout's JS into it (seconds, no native build), claims a simulator, installs and
#    runs the specs.
#
# Needs NPM_TOKEN (classic PAT, read:packages) as a secret in the `preview` EAS environment: `bun install` pulls
# @delacournz/* from GitHub Packages. The build job reads the same environment (eas.json `bench.environment`).
#
# Run: bunx eas-cli workflow:run .eas/workflows/e2e.yml
#      bunx eas-cli workflow:run .eas/workflows/e2e.yml -F suite=conditions
#      bunx eas-cli workflow:run .eas/workflows/e2e.yml -F args='--specs app/onboarding,app/todos'
#      bunx eas-cli workflow:run .eas/workflows/e2e.yml -F warden=npm

on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
        description: warden.config.ts e2e suite (example, conditions, a11y, biometrics, camera)
        default: example
      args:
        type: string
        description: Extra `warden e2e` arguments (`--all`, `--specs <ids>`, `--count 2`, `--retry 1`)
        default: --all --retry 1
      profile:
        type: string
        description: eas.json build profile to reuse or build (a Release simulator build, no dev client)
        default: bench
      warden:
        type: choice
        description: source = this checkout's CLI; npm = the published release at the @delacour/warden-e2e version
        options: [source, npm]
        default: source

defaults:
  tools:
    bun: 1.4.3

jobs:
  # Fingerprint the native project, then look for an existing build of `profile` with that hash.
  fingerprint:
    type: fingerprint

  get_ios_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: ${{ inputs.profile }}
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  # Build only when no build matches the fingerprint.
  build_ios:
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: ${{ inputs.profile }}

  # `after`, not `needs`: build_ios is skipped when a build was found, and a skipped need would skip this job.
  e2e_ios:
    name: warden e2e (iOS)
    after: [get_ios_build, build_ios]
    if: ${{ always() && (needs.get_ios_build.outputs.build_id || needs.build_ios.outputs.build_id) }}
    runs_on: macos-large
    environment: preview
    env:
      # No golden simulator in a non-GUI session: every sim is a fresh `simctl create`.
      WARDEN_GOLDEN: '0'
    steps:
      - uses: eas/checkout

      - uses: eas/install_node_modules

      # A shim like `bun run cli:link`, so specs run against this checkout's @delacour/warden-e2e too. The CLI's
      # package version names the released helper (warden-simd) to fetch; a helper change still needs a release.
      - name: Run warden from this checkout
        if: ${{ inputs.warden == 'source' }}
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec bun "%s/apps/cli/src/cli.ts" "$@"\n' "$(cd ../.. && pwd)" > "$HOME/.local/bin/warden"
          chmod +x "$HOME/.local/bin/warden"
          set-env PATH "$HOME/.local/bin:$PATH"
          export PATH="$HOME/.local/bin:$PATH"
          warden --version
          warden doctor --fetch-helper

      # The CLI must match the @delacour/warden-e2e the specs import (the preload exits 2 on a mismatch).
      - name: Pick the warden version
        id: warden
        if: ${{ inputs.warden == 'npm' }}
        run: set-output version "$(bun -p "require('@delacour/warden-e2e/package.json').version")"

      - uses: eas/restore_cache
        id: warden_cache
        if: ${{ inputs.warden == 'npm' }}
        with:
          key: warden-cli-darwin-arm64-${{ steps.warden.outputs.version }}
          path: /Users/expo/.warden-cli

      # The darwin-arm64 package carries the native binary with the simulator helper (warden-simd) beside it: put that
      # dir on PATH, not npm's bin/warden link, which eas/save_cache stores as a copy that warden 0.16.0 cannot resolve.
      - name: Install warden
        if: ${{ inputs.warden == 'npm' }}
        run: |
          BIN="$HOME/.warden-cli/lib/node_modules/@delacour/warden/node_modules/@delacour/warden-darwin-arm64/bin"
          if [ ! -x "$BIN/warden" ]; then
            npm install --global --prefix "$HOME/.warden-cli" "@delacour/warden@${{ steps.warden.outputs.version }}"
          fi
          set-env PATH "$BIN:$PATH"
          "$BIN/warden" --version

      - uses: eas/save_cache
        if: ${{ inputs.warden == 'npm' && steps.warden_cache.outputs.cache_hit != 'true' }}
        with:
          key: warden-cli-darwin-arm64-${{ steps.warden.outputs.version }}
          path: /Users/expo/.warden-cli

      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ needs.get_ios_build.outputs.build_id || needs.build_ios.outputs.build_id }}
          extensions: [app]

      - name: Use the EAS build as the simulator base
        run: warden builds import "${{ steps.download_build.outputs.artifact_path }}" --kind simulator-base

      # Repacks this checkout's JS into the imported base first (logged as `simulator repack <jsKey>`).
      - name: Run the specs
        run: warden e2e ${{ inputs.suite }} --headless --report /Users/expo/warden-e2e/e2e-report.json ${{ inputs.args }}

      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: warden-e2e
          ignore_error: true
          path: |
            /Users/expo/warden-e2e/**/*
            /Users/expo/.warden/batches/**/*
            /Users/expo/.warden/logs/**/*
