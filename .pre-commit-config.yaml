# `prek install` (root postinstall) installs only the pre-commit hook unless told otherwise; without this the
# pre-push stage below never ran on any machine.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        language: system
        entry: bun run scripts/pre-commit-biome.ts
        pass_filenames: false
        stages: [pre-commit]

      # The always-on signoff checks (typecheck, check, test) on the shared turbo cache: the signoff after the
      # push replays them. scripts/signoff/pre-push.ts derives the tasks from signoff-checks.ts.
      - id: signoff-checks
        name: signoff checks (typecheck, check, test)
        language: system
        entry: bun scripts/signoff/pre-push.ts
        pass_filenames: false
        stages: [pre-push]
