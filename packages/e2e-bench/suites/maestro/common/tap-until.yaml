appId: nz.co.delacour.warden.example
---
# Parity with flows.ts tapUntil: tap TARGET, wait up to 4 s for ARRIVED, retap (max 2 retaps).
# The first tab/row tap after sign-in can be dropped; a second tap always lands. retry reruns the block only
# when the wait fails, so the happy path pays for no condition check (a `when` guard costs ~7 s on its false side).
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "${TARGET}"
      - extendedWaitUntil:
          visible:
            id: "${ARRIVED}"
          timeout: 4000
