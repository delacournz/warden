appId: nz.co.delacour.warden.example
name: sign-in-valid-credentials
---
- runFlow: common/open-sign-in.yaml
- runFlow:
    file: common/submit-sign-in.yaml
    env:
      EMAIL: "Ada@Example.com"
      PASSWORD: "password1"
- extendedWaitUntil:
    visible:
      id: "todos-screen"
    timeout: 15000
- assertVisible:
    text: "1 left"
    childOf:
      id: "todos-remaining"
