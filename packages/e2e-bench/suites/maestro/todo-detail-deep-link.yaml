appId: nz.co.delacour.warden.example
name: todo-detail-deep-link
---
- runFlow:
    file: common/signed-in.yaml
    env:
      EMAIL: "ada@example.com"
# Parity with flows.ts openDeepLink: open, wait up to 6 s for the detail title, reopen (max 3 attempts).
- retry:
    maxRetries: 2
    commands:
      - openLink: "warden-example://todo/warden"
      - extendedWaitUntil:
          visible:
            id: "todo-detail-title"
          timeout: 6000
- assertVisible:
    id: "todo-detail-title"
    text: "Run the e2e suite with warden"
- assertVisible:
    text: "Done"
    childOf:
      id: "todo-detail-status"
