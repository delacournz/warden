appId: nz.co.delacour.warden.example
name: todo-detail-open-toggle-delete
---
- runFlow:
    file: common/signed-in.yaml
    env:
      EMAIL: "ada@example.com"
- runFlow:
    file: common/tap-until.yaml
    env:
      TARGET: "todo-title-welcome"
      ARRIVED: "todo-detail-title"
- assertVisible:
    id: "todo-detail-title"
    text: "Explore the example app"
- assertVisible:
    text: "Active"
    childOf:
      id: "todo-detail-status"
- tapOn:
    id: "todo-detail-toggle"
- assertVisible:
    text: "Done"
    childOf:
      id: "todo-detail-status"
- tapOn:
    id: "todo-detail-delete"
- assertVisible:
    id: "todos-screen"
- assertNotVisible:
    id: "todo-row-welcome"
