appId: nz.co.delacour.warden.example
name: settings-account-switches-sign-out
---
- runFlow:
    file: common/signed-in.yaml
    env:
      EMAIL: "grace@example.com"
- runFlow:
    file: common/tap-until.yaml
    env:
      TARGET: "tab-settings"
      ARRIVED: "settings-email"
- assertVisible:
    id: "settings-email"
    text: "grace@example.com"
- assertVisible:
    id: "settings-notifications"
    checked: true
- tapOn:
    id: "settings-notifications"
- assertVisible:
    id: "settings-notifications"
    checked: false
- tapOn:
    id: "settings-dark-mode"
- assertVisible:
    id: "settings-dark-mode"
    checked: true
- tapOn:
    id: "settings-dark-mode"
- tapOn:
    id: "settings-sign-out"
- assertVisible:
    id: "welcome-screen"
