# A deep link opened from outside the app raises the iOS "Open in “warden-example”?" sheet; the `when:` guards answer
# it the way the other suites' system-alert helpers do, then retry the link when the detail screen has not shown.
steps:
  - launch: nz.co.delacour.warden.example
  - run: fragments/signed-in-ada
  - tool: open-url
    args: { url: "warden-example://todo/warden" }
  - when: { visible: { text: Open } }
    steps:
      - tap: { text: Open }
  - await: { idle: true, timeout: 6000 }
  - when: { hidden: { id: todo-detail-title } }
    steps:
      - tool: open-url
        args: { url: "warden-example://todo/warden" }
      - when: { visible: { text: Open } }
        steps:
          - tap: { text: Open }
      - await: { idle: true, timeout: 6000 }
      - when: { hidden: { id: todo-detail-title } }
        steps:
          - tool: open-url
            args: { url: "warden-example://todo/warden" }
          - when: { visible: { text: Open } }
            steps:
              - tap: { text: Open }
  - await: { visible: { id: todo-detail-title } }
  - assert: { text: { in: { id: todo-detail-title }, equals: Run the e2e suite with warden } }
  - assert: { text: { in: { id: todo-detail-status }, equals: Done } }
