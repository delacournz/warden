steps:
  - launch: nz.co.delacour.warden.example
  - run: fragments/open-sign-in
  - type: { into: { id: sign-in-email }, text: Ada@Example.com, submit: false }
  - type: { into: { id: sign-in-password }, text: password1, submit: false }
  - tap: { id: sign-in-submit }
  - await: { visible: { id: todos-screen }, timeout: 15000 }
  - await: { idle: true }
  - assert: { text: { in: { id: todos-remaining }, equals: 1 left } }
