steps:
  - launch: nz.co.delacour.warden.example
  - run: fragments/open-sign-in
  - type: { into: { id: sign-in-email }, text: not-an-email, submit: false }
  - type: { into: { id: sign-in-password }, text: password1, submit: false }
  - tap: { id: sign-in-submit }
  - assert: { text: { in: { id: sign-in-email-error }, equals: Enter a valid email address. } }
  - type: { into: { id: sign-in-email }, text: ada@example.com, submit: false }
  - type: { into: { id: sign-in-password }, text: short, submit: false }
  - tap: { id: sign-in-submit }
  - assert: { text: { in: { id: sign-in-password-error }, equals: Password must be at least 8 characters. } }
