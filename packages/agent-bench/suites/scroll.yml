# Scroll-to-find: the Clock row sits below the fold of the Settings list.
name: scroll
description: Sign in, then scroll Settings to find and open the Clock screen
prompt: ../prompts/scroll.md
platform: ios
app: example
model: claude-sonnet-5-5
allowedTools: ["Bash(warden *)", "Skill", "Read"]
maxTurns: 50
timeoutMs: 600000
failurePatterns: [stale_ref, E_TIMEOUT, target_not_found, wait_target_absent, wait_text_absent, device_not_leased, device_foreign, ambiguous_device, usage]
success:
  - wait: id=clk-screen
