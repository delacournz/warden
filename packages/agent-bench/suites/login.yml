# Onboarding, sign-in and one tab switch: the shortest realistic flow.
name: login
description: Get past onboarding, sign in, then open the Settings tab
prompt: ../prompts/login.md
platform: ios
app: example
model: claude-sonnet-5-5
allowedTools: ["Bash(warden *)", "Skill", "Read"]
maxTurns: 40
timeoutMs: 600000
failurePatterns: [stale_ref, E_TIMEOUT, target_not_found, wait_target_absent, wait_text_absent, device_not_leased, device_foreign, ambiguous_device, usage]
success:
  - wait: id=settings-screen
  - wait: text "ada@example.com"
