version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # The docs image's base images are pinned by digest (apps/docs/Dockerfile); this moves tag and
  # digest together.
  - package-ecosystem: docker
    directory: /apps/docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
