version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # The docs image's base images are pinned by digest (apps/docs/Dockerfile); this moves tag and
  # digest together. A new bun tag is meant to fail scripts/release/repo-hardening.test.ts until the
  # same pull request also moves the root `packageManager` and the `bun-v…` installs in
  # apps/example/.eas/workflows/bench-baseline.yml: one bun version everywhere, bumped in one change.
  - package-ecosystem: docker
    directory: /apps/docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
