name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# Build and publish are split so dependency code never runs next to publish
# credentials: `build` installs/compiles with a read-only token and no secrets;
# `publish` holds the OIDC + release write permissions but never installs or
# executes repo dependencies. Both stay on GitHub-hosted runners — npm trusted
# publishing and provenance don't support self-hosted ones.
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Tag must match apps/cli version
        run: |
          version=$(bun -p "require('./apps/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match apps/cli/package.json version $version" >&2
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run check
      - run: bun run test

      - name: Build release binaries
        run: bun run --cwd apps/cli build:release

      # Repository / homepage / bugs links go into the manifests only once the repo is public.
      - name: Stage npm packages
        env:
          WARDEN_NPM_REPO_LINKS: ${{ github.event.repository.private == false && '1' || '0' }}
        run: bun run --cwd apps/cli build:npm

      # Tarball keeps the binaries' executable bit, which artifacts drop.
      - run: tar -czf dist.tgz -C apps/cli dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers on this environment gate every publish; npm's trusted
    # publisher is bound to this workflow file + environment.
    environment: release
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - run: tar -xzf dist.tgz

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/warden-* dist/checksums.txt --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

      # Platform packages first so @delacour/warden's optionalDependencies resolve the moment it lands.
      # Already-published versions are skipped, so a re-run finishes a partial publish.
      # Auth is OIDC trusted publishing (npm >= 11.5.1); NPM_TOKEN is only a fallback until
      # the trusted publisher is configured on npmjs.com, then delete the secret.
      # --ignore-scripts: nothing in the tarballs runs here.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          provenance=""
          if [ "$REPO_PRIVATE" = "false" ]; then provenance="--provenance"; fi
          for dir in dist/npm/warden-*/ dist/npm/warden/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            npm publish "./$dir" --access public --ignore-scripts $provenance
          done
