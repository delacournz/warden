name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Tag must match apps/cli version
        run: |
          version=$(bun -p "require('./apps/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match apps/cli/package.json version $version" >&2
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run check
      - run: bun run test

      - name: Build release binaries
        run: bun run --cwd apps/cli build:release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apps/cli/dist/warden-* apps/cli/dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
