name: ci

# Pull requests into develop are gated on local signoff, not on this workflow: `bun run signoff` runs
# the checks on the authoring machine and writes the `signoff` commit status branch protection
# requires (scripts/signoff/, AGENTS.md § Signoff). Running the same checks again on billed macOS
# runners for every push was the cost this replaced.
#
# This is the escape hatch for a machine that cannot run a check (no Mac, no Xcode for `native`).
# It runs every check scripts/signoff/signoff-checks.ts defines against one commit and, only when
# all of them pass, writes the same statuses a local run would:
#
#   gh workflow run ci --ref <branch> -f signoff-sha=$(git rev-parse HEAD)
#
# Dispatching needs write access, so a maintainer chooses every run. For a fork PR, review the code
# first: this checks it out and runs it. The status write lives in its own job that never checks
# anything out, so only that job holds `statuses: write`.
on:
  workflow_dispatch:
    inputs:
      signoff-sha:
        description: Full commit SHA to test and sign off (the PR head)
        required: true
        type: string

permissions:
  contents: read

# One run per branch, newest wins. A signoff binds to a SHA, so once a branch moves on (a second
# merge into develop re-pushes the version PR head seconds after the first; a maintainer dispatches
# again after a push) the older run's result is already stale: cancel it instead of paying for two.
# The cancelled run's `signoff` job still settles its pending status as failure, so the old SHA
# never shows "in progress". Keyed on the ref, not the SHA: two dispatches on one branch with
# different heads must share a group for the newer to cancel the older.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The SHA ends up in API paths and checkout refs; refuse anything but a full hex SHA.
  validate:
    runs-on: namespace-profile-linux-small
    steps:
      - env:
          SHA: ${{ inputs.signoff-sha }}
        run: |
          if ! echo "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "signoff-sha must be a full 40-char commit SHA, got: $SHA" >&2; exit 1
          fi

  # A dispatched run is bound to the ref it was started on, so the PR's Checks tab shows nothing
  # until the final status lands and the required `signoff` row reads "waiting for status". Post it
  # as pending straight away, pointing at this run, so the PR shows the check in progress. The
  # `signoff` job settles it as success or failure. Never checks anything out.
  pending:
    needs: validate
    runs-on: namespace-profile-linux-small
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.signoff-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=signoff \
            -f "description=GitHub Actions (ci) running checks" -f "target_url=$RUN_URL" > /dev/null

  checks:
    needs: validate
    runs-on: namespace-profile-mac-small
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          ref: ${{ inputs.signoff-sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # After checkout (which wipes the workspace) and setup-bun (mode needs bun on PATH).
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: bun

      # NPM_TOKEN (read:packages) installs the optional `@delacournz/*` design systems, which the apps
      # that render one need to typecheck and test. The native job below installs without it, which
      # keeps proving a tokenless clone installs.
      - run: bun install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - run: bun run typecheck
      - run: bun run check
      - run: bun run test

  # Paths filter for the native and viewer jobs: does this commit touch packages/e2e/native/** or apps/viewer/**
  # against develop?
  native-changes:
    needs: validate
    runs-on: namespace-profile-linux-small
    outputs:
      native: ${{ steps.paths.outputs.native }}
      viewer: ${{ steps.paths.outputs.viewer }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.signoff-sha }}
        run: |
          # An unreadable compare runs native rather than skipping it.
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...$SHA" --jq '.files[].filename' 2>/dev/null || printf 'packages/e2e/native/\napps/viewer/\n')
          if echo "$files" | grep -q '^packages/e2e/native/'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi
          # Markdown never affects the viewer's Rust (signoff-checks.ts ignores it the same way).
          if echo "$files" | grep -q '^apps/viewer/' && echo "$files" | grep '^apps/viewer/' | grep -qv '\.md$'; then
            echo "viewer=true" >> "$GITHUB_OUTPUT"
          else
            echo "viewer=false" >> "$GITHUB_OUTPUT"
          fi

  # warden-simd (Swift, links idb's library package): deps + build + swift test. macOS-only, so it has its own job.
  # native:deps downloads the pinned idb release tarball (no idb checkout; `--from-source` shallow-clones the tag
  # into ~/Library/Caches/warden-idb/src itself). swift test uses fixtures, no simulator.
  native:
    needs: native-changes
    if: needs.native-changes.outputs.native == 'true'
    runs-on: namespace-profile-mac-small
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          ref: ${{ inputs.signoff-sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # idb's library package is built with a recent Swift; use the newest Xcode the runner image has.
      - run: |
          xcode=$(ls -d /Applications/Xcode_*.app /Applications/Xcode-*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          swift --version

      # Namespace cache volume (keyless, persists across runs): idb tarball/source + SwiftPM build products
      # (idb's library package compiles for minutes). SwiftPM's incremental build handles stale products.
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/Library/Caches/warden-idb
            packages/e2e/native/ios/.build
            packages/e2e/native/ios-runner/RunnerCore/.build

      # No NPM_TOKEN: `@delacournz/*` (GitHub Packages) is only apps/docs' optional OpenTelemetry, which
      # nothing here uses. The 401 is a warning, and this proves a tokenless clone installs.
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/e2e native:deps
      - run: bun run --cwd packages/e2e native:build
      - run: swift test --package-path packages/e2e/native/ios
      # warden-runner (XCUITest, real devices): RunnerCore's tests, then the unsigned iOS build of the checked-in project.
      - run: swift test --package-path packages/e2e/native/ios-runner/RunnerCore
      - run: >-
          xcodebuild build-for-testing -project packages/e2e/native/ios-runner/WardenRunner.xcodeproj
          -scheme WardenRunner -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO
          WARDEN_RUNNER_BUNDLE_ID=nz.co.delacour.warden.runner.ci

  # The viewer's Rust tests (apps/viewer, Tauri). Its TypeScript is covered by the `checks` job. Path-gated,
  # never a required context: the umbrella still waits on it through the `signoff` job below.
  viewer:
    needs: native-changes
    if: needs.native-changes.outputs.viewer == 'true'
    runs-on: namespace-profile-mac-small
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          ref: ${{ inputs.signoff-sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1 (stable toolchain)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: apps/viewer/src-tauri -> target

      # `@delacournz/apogee` (GitHub Packages) needs the read:packages token; only the viewer's closure is installed.
      - run: bun install --frozen-lockfile --filter @delacour/warden-viewer
        env:
          NPM_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - run: bun run --cwd apps/viewer build:frontend
      - run: bun run --cwd apps/viewer test:rust

  # Writes the statuses, sub-contexts first and the required `signoff` umbrella last, only when every
  # applicable check passed. Skipped jobs count as passing for `needs`, so results are checked explicitly.
  # A failed or cancelled check settles the pending `signoff` as failure, so the PR never shows a run
  # that is still "in progress" after it ended.
  signoff:
    needs: [pending, checks, native-changes, native, viewer]
    if: always()
    runs-on: namespace-profile-linux-small
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.signoff-sha }}
          CHECKS: ${{ needs.checks.result }}
          NATIVE: ${{ needs.native.result }}
          VIEWER: ${{ needs.viewer.result }}
          NATIVE_CHANGES: ${{ needs.native-changes.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fail() {
            echo "$1" >&2
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=failure -f context=signoff \
              -f "description=GitHub Actions (ci): $1" -f "target_url=$RUN_URL" > /dev/null
            exit 1
          }
          if [ "$CHECKS" != "success" ]; then fail "checks $CHECKS"; fi
          if [ "$NATIVE_CHANGES" != "success" ]; then fail "native-changes $NATIVE_CHANGES"; fi
          # native is skipped when the commit does not touch packages/e2e/native/**.
          if [ "$NATIVE" != "success" ] && [ "$NATIVE" != "skipped" ]; then fail "native $NATIVE"; fi

          # viewer is skipped when the commit does not touch apps/viewer/**.
          if [ "$VIEWER" != "success" ] && [ "$VIEWER" != "skipped" ]; then fail "viewer $VIEWER"; fi

          post() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f "context=$1" \
              -f "description=GitHub Actions (ci) signed off" -f "target_url=$RUN_URL" > /dev/null
          }
          post signoff/typecheck
          post signoff/check
          post signoff/test
          if [ "$NATIVE" = "success" ]; then
            post signoff/native
          fi
          if [ "$VIEWER" = "success" ]; then
            post signoff/viewer
          fi
          post signoff
