name: ci

# PRs from maintainers (OWNER / MEMBER / COLLABORATOR) run on every push.
# Everyone else gets a failing `ci` until a maintainer approves the current
# head commit; ci-approve.yml then re-runs this workflow. A new push needs a
# fresh approval. Require the `ci` check on main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          is_maintainer() { case "$1" in OWNER|MEMBER|COLLABORATOR) return 0;; *) return 1;; esac; }

          if [ "$EVENT" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if is_maintainer "$AUTHOR_ASSOC"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          approved=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\"
                   and (.author_association | IN(\"OWNER\",\"MEMBER\",\"COLLABORATOR\")))] | length" \
            | awk '{s+=$1} END {print s+0}')

          if [ "$approved" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Awaiting maintainer approval of $HEAD_SHA before CI runs"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: bun run test

  # Single required status check. Skipped jobs count as passing for branch
  # protection, so this fails explicitly when CI hasn't been approved/run.
  ci:
    needs: [gate, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GATE: ${{ needs.gate.result }}
          RUN: ${{ needs.gate.outputs.run }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          if [ "$GATE" != "success" ]; then echo "gate $GATE" >&2; exit 1; fi
          if [ "$RUN" != "true" ]; then echo "awaiting maintainer approval" >&2; exit 1; fi
          if [ "$CHECKS" != "success" ]; then echo "checks $CHECKS" >&2; exit 1; fi
