name: e2e

# warden's own iOS e2e suite (`apps/example`) on a hosted macOS runner, through the reusable action
# in .github/actions/e2e. Separate from `ci` (the signoff escape hatch) so it never slows a PR that
# touches nothing it covers: pull requests only run it for the paths below.
#
# Caches: a pull request restores what `develop` saved but never saves (`save-cache`), so a branch can't
# evict the default branch's entries. A push to develop or main runs the suite and fills them.
on:
  pull_request:
    branches: [develop]
    paths:
      - apps/example/**
      - apps/cli/**
      - packages/core/**
      - packages/e2e/**
      - bun.lock
      - package.json
      - .github/actions/e2e/**
      - .github/workflows/e2e.yml
  push:
    branches: [develop, main, feat/ci-e2e-action]
    paths:
      - apps/example/**
      - apps/cli/**
      - packages/core/**
      - packages/e2e/**
      - bun.lock
      - package.json
      - .github/actions/e2e/**
      - .github/workflows/e2e.yml
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label (default the repo variable WARDEN_E2E_RUNNER, else xcode-27)
        type: string
        default: ""
      count:
        description: Simulators in parallel (empty = the suite's)
        type: string
        default: ""
      retry:
        description: Reruns of a failed spec
        type: string
        default: "1"
      args:
        description: Extra `warden e2e` arguments
        type: string
        default: --all
      warden-version:
        description: Release tag or latest
        type: string
        default: latest
      save-cache:
        description: Save the caches after a green run
        type: boolean
        default: true

permissions:
  contents: read
  # bun install pulls @delacournz/* from GitHub Packages with the job token.
  packages: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    runs-on: ${{ inputs.runner || vars.WARDEN_E2E_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: e2e
        uses: ./.github/actions/e2e
        with:
          working-directory: apps/example
          suite: example
          count: ${{ inputs.count }}
          retry: ${{ inputs.retry || '1' }}
          args: ${{ github.event_name == 'workflow_dispatch' && inputs.args || '--all' }}
          warden-version: ${{ inputs.warden-version || 'latest' }}
          save-cache: ${{ github.event_name == 'pull_request' && 'false' || (github.event_name == 'workflow_dispatch' && inputs.save-cache && 'true') || (github.event_name == 'push' && 'true') || 'false' }}
