name: ci-approve

# When a maintainer approves a non-maintainer PR, re-run its `ci` workflow for
# the approved head commit. The gate in ci.yml re-checks the approval itself.
# Job is not named `ci`, so skipped runs here never satisfy the required check.
on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: read

jobs:
  rerun-ci:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: namespace-profile-linux-small
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          perm() { gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq .permission 2>/dev/null || echo none; }
          is_maintainer() { case "$(perm "$1")" in admin|maintain|write) return 0;; *) return 1;; esac; }

          # Maintainer PRs already ran CI; only maintainer approvals unlock others.
          if is_maintainer "$AUTHOR" || ! is_maintainer "$REVIEWER"; then
            echo "nothing to re-run"; exit 0
          fi

          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "no ci run for $HEAD_SHA" >&2; exit 1
          fi
          gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"
